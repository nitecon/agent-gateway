app: agent-gateway-interactive-execution
title: Retired interactive execution contract
summary: The v1.18 assignment/session executor protocol is removed; use the task lifecycle stream instead.
kind: agent_context
source_format: agent_context
source_ref: .agent/api/task-stream.yaml
version: v1.19.0
labels: [gateway, execution, websocket, cmux, retired]
content:
  migration:
    - The former /v1/execution/connect and /v1/execution/sessions endpoints are removed in v1.19.0.
    - Per-project execution policy, cadence, gateway-host agent launching and provider fallback settings are removed.
    - Use the single bearer-authenticated /v1/tasks/stream connection described by .agent/api/task-stream.yaml.
    - cmux must implement task lifecycle subscription and global experimental injection approval; old assignment clients must upgrade before subscribing.
    - Existing execution records and summaries remain read-only; unfinished runs are retired without task changes or replay.
